<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NEXUS — Projects, People & Payments. Project management and client billing system." />
    <title>NEXUS · Projects, People &amp; Payments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231C1917'/%3E%3Cpath d='M10 22V10l12 12V10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('nexus.db.v1') || 'null');
        var t = s && s.settings && s.settings.uiV2 ? s.settings.theme : 'light';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <!--CSS-->
  </head>
  <body>
    <div id="root"></div>
    <noscript>NEXUS needs JavaScript enabled to run.</noscript>
    <!--JS-->
  </body>
</html>
